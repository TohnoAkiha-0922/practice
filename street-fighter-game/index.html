<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>&#34903;&#21306;&#23545;&#20915;</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="shell">
    <section class="hud" aria-label="game status">
      <div class="fighter-card player-card">
        <span class="label">&#20320;</span>
        <div class="bar health"><span id="playerHealth"></span></div>
        <div class="bar energy"><span id="playerEnergy"></span></div>
      </div>
      <div class="round-panel">
        <strong id="roundText">ROUND 1</strong>
        <span id="timerText">90</span>
      </div>
      <div class="fighter-card rival-card">
        <span class="label">&#23545;&#25163;</span>
        <div class="bar health"><span id="enemyHealth"></span></div>
        <div class="bar energy"><span id="enemyEnergy"></span></div>
      </div>
    </section>

    <canvas id="game" width="960" height="540" aria-label="2D street fighting game"></canvas>

    <section class="controls" aria-label="controls">
      <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> &#31227;&#21160;</span>
      <span><kbd>Space</kbd> &#36339;&#36291;</span>
      <span><kbd>J</kbd> &#26222;&#36890;&#25915;&#20987;</span>
      <span><kbd>K</kbd> &#37325;&#20987;</span>
      <span><kbd>L</kbd> &#26684;&#25377;</span>
      <span><kbd>U</kbd><kbd>I</kbd> &#25216;&#33021;</span>
      <span><kbd>O</kbd> &#22823;&#25307;</span>
      <button id="restartBtn" type="button">&#37325;&#26032;&#24320;&#22987;</button>
    </section>
  </main>

  <div id="banner" class="banner hidden">
    <strong id="bannerTitle"></strong>
    <span id="bannerText"></span>
  </div>

  <script src="./game.js?v=20260530-facing-fix"></script>
</body>
</html>
